openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: search
    description: Music search operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /search:
    get:
      operationId: searchSongs
      tags: [search]
      summary: Search songs
      description: Searches public Piped API instances with automatic fallback.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Normalized song results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SongSearchResult"
        "400":
          description: Search term is missing
        "502":
          description: Upstream music providers are unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SongSearchResult:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        duration:
          type: string
        durationSeconds:
          type: ["number", "null"]
        cover:
          type: string
        streamUrl:
          type: ["string", "null"]
      required:
        - id
        - title
        - artist
        - album
        - duration
        - durationSeconds
        - cover
        - streamUrl

